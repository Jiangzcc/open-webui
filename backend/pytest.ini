# 二开新增：本地 pytest 配置（不修改上游 pyproject.toml，降低同步升级冲突）
# 作用：关闭本项目测试用不到的 pytest 插件，减少每次单测的加载开销。
# 背景：通过 `python -X importtime` 排查发现，pytest 自动加载的 langsmith 插件
# （由 langchain 间接引入）会在每次收集时强制导入 langsmith.utils / langsmith.schemas /
# httpx / requests 等一堆与本项目单测无关的模块，单项累计约 0.6~1.0s。
[pytest]
# 关闭本项目测试不需要的插件：
#   - langsmith_plugin：langchain 间接依赖，仅 LangSmith 追踪用得到，单测无需
#   - docker：pytest-docker，本项目用 sqlite 内存/临时库做测试，无需 docker 编排
#   - anyio：与 pytest-asyncio 功能重叠，本项目异步 fixture 走 asyncio 插件即可
# 保留 asyncio（异步 fixture 必需）、cacheprovider（影响小，缓存上次失败用例）。
addopts = -p no:langsmith_plugin -p no:docker -p no:anyio
